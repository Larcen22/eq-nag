name: Release (Linux + Windows)

# Builds both the Windows portable exe and the Linux AppImage and publishes
# them to a GitHub Release.
#
# - Pushing a tag like v0.2.27 builds and publishes that version automatically.
# - Running it manually (workflow_dispatch) builds the version in package.json
#   and creates the matching release/tag.
#
# This is independent of the Windows-only Pre-release/Release workflows, which
# use .github/scripts/nag-release.py and their own version scheme.

on:
  push:
    # Only semantic version tags, so an unrelated tag starting with "v"
    # (void, verify, ...) cannot trigger a two-OS build that publishes a
    # public release.
    tags: 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # GITHUB_TOKEN creates the release and uploads assets

concurrency:
  group: nag-linux-release

jobs:
  windows:
    runs-on: windows-2022   # node-gyp cannot use the VS on windows-latest yet
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      # extraResources references .env, intentionally untracked/empty.
      - name: Ensure .env exists
        shell: bash
        run: touch .env

      - name: Set the version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set production config
        shell: bash
        run: npm run set-production-env

      - name: Build Angular (production)
        shell: bash
        run: npx ng build --configuration=production

      - name: Build Windows portable exe
        shell: bash
        run: npx electron-builder build --win portable --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: electron/output/eq_nag_portable.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      # --ignore-scripts skips native build scripts (active-win/electron-winstaller
      # only build on Windows/macOS). The app never loads active-win on Linux
      # (see src/electron/utilities/active-win-shim.js), so the unbuilt package
      # is harmless here.
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Ensure .env exists
        shell: bash
        run: touch .env

      - name: Set the version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set production config
        shell: bash
        run: npm run set-production-env

      - name: Build Angular (production)
        shell: bash
        run: npx ng build --configuration=production

      - name: Build Linux AppImage
        shell: bash
        run: npx electron-builder build --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: electron/output/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A missing asset here means one build broke while the other passed;
      # publishing would ship an incomplete release, so fail instead.
      - name: Verify both binaries are present
        shell: bash
        run: |
          ls -l artifacts/windows artifacts/linux
          [ -s artifacts/windows/eq_nag_portable.exe ] || { echo "Windows artifact missing"; exit 1; }
          ls artifacts/linux/*.AppImage >/dev/null || { echo "Linux artifact missing"; exit 1; }

      # An earlier run can leave a release with no assets (the upload step is
      # independent of the create step); delete those before publishing so
      # the release list stays clean.
      - name: Prune empty releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.assets | length == 0) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/releases/$id"
          done

      - name: Create the GitHub release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # The tag already exists (it triggered this workflow), so gh release
          # create would refuse; create the release via the REST API instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
          else
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F generate_release_notes=true
          fi

          gh release upload "$TAG" \
            artifacts/windows/* \
            artifacts/linux/* \
            --clobber
